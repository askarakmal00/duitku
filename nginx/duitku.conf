# Konfigurasi Nginx untuk DuitKu
# Salin file ini ke: /etc/nginx/sites-available/duitku.conf
# Lalu symlink ke: ln -s /etc/nginx/sites-available/duitku.conf /etc/nginx/sites-enabled/
# Jalankan certbot: certbot --nginx -d domainanda.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Ganti dengan domain/subdomain Anda

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}

